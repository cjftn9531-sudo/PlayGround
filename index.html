<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#151111" />
  <title>고기왕 — 도축 영웅</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="game-shell">
    <canvas id="game"></canvas>
    <div class="vignette"></div>
    <header class="topbar">
      <div class="brand"><span class="brand-mark">칼</span><div><b>고기왕</b><small>도축 영웅</small></div></div>
      <div class="top-stats"><div class="stat-chip"><span>🥩</span><b id="meat">0</b></div><div class="stat-chip"><span>🪙</span><b id="coins">0</b></div><button id="sound-btn" class="icon-btn" aria-label="소리 켜기">♫</button></div>
    </header>
    <section class="hud">
      <div class="level-line"><span class="level-badge">Lv.<b id="level">1</b></span><div class="xp-wrap"><div class="xp-head"><span>성장 경험치</span><b><i id="xp-now">0</i> / <i id="xp-max">5</i></b></div><div class="xp-track"><div id="xp-fill"></div></div></div></div>
      <div class="health-wrap"><span>♥</span><div class="health-track"><div id="health-fill"></div></div><b id="health-text">100 / 100</b></div>
      <div class="wave-pill"><span class="pulse"></span><span id="wave-label">준비 완료</span><b id="wave-num"></b></div>
    </section>
    <div id="toast" class="toast"></div>
    <div class="brand-caption"><span>도축장 골목</span><i></i><span id="enemy-count">도깨비 0</span></div>
    <div class="mobile-controls" id="mobile-controls">
      <div id="joystick" class="joystick"><div class="joy-ring"></div><div id="joy-knob" class="joy-knob"></div></div>
      <button id="attack-btn" class="attack-btn"><span class="blade-icon">⚔</span><b>베기</b><small>누르고 있기</small></button>
    </div>
    <div class="desktop-hint"><span>W A S D</span> 이동 <i>·</i> <span>SPACE</span> 베기</div>
    <div class="overlay" id="start-screen">
      <div class="menu-card start-card">
        <div class="eyebrow"><span></span> 오늘의 사냥을 시작하자 <span></span></div>
        <h1>고기<span>왕</span></h1>
        <p class="subtitle">도축 영웅</p>
        <div class="hero-medallion"><div class="medallion-glow"></div><div class="hero-emoji">🔪</div><span class="spark s1">✦</span><span class="spark s2">✧</span></div>
        <p class="intro">골목의 도깨비를 물리치고<br>전설의 고기를 모아라!</p>
        <button id="start-btn" class="primary-btn">사냥 시작 <span>→</span></button>
        <div class="mini-guide"><span>◉ 이동</span><span>✦ 베기</span><span>⬆ 성장</span></div>
      </div>
    </div>
    <div class="overlay hidden" id="level-screen">
      <div class="menu-card upgrade-card"><div class="eyebrow"><span></span> 더욱 강해지는 시간 <span></span></div><h2>성장 선택</h2><p>하나를 골라 전투력을 높이세요</p><div class="upgrade-list" id="upgrade-list"></div></div>
    </div>
    <div class="overlay hidden" id="pause-screen">
      <div class="menu-card compact-card"><div class="eyebrow"><span></span> 잠깐 쉬어가기 <span></span></div><h2>일시 정지</h2><p>사냥은 아직 끝나지 않았어요.</p><button id="resume-btn" class="primary-btn">계속하기 <span>→</span></button><button id="restart-btn" class="text-btn">처음부터 다시</button></div>
    </div>
    <div class="overlay hidden" id="gameover-screen">
      <div class="menu-card compact-card"><div class="eyebrow"><span></span> 오늘의 사냥 결과 <span></span></div><h2>잠시 쉬어가요</h2><div class="result-score"><b id="final-kills">0</b><span>마리 처치</span></div><p>모은 고기 <b id="final-meat">0</b>개 · 코인 <b id="final-coins">0</b>개</p><button id="retry-btn" class="primary-btn">다시 도전 <span>→</span></button></div>
    </div>
    <button id="pause-btn" class="pause-btn" aria-label="일시 정지">Ⅱ</button>
    <div class="toast" id="toast-2"></div>
  </main>
  <script type="module" src="game.js"></script>
</body>
</html>
